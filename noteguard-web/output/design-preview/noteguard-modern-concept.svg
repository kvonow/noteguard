<text x="705" y="319" text-anchor="end" fill="#9BA7A0" font-family="Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">17번</text>
<path d="M129 335H705" stroke="#EEF0EB"/>
<text x="129" y="387" fill="#17211F" font-family="Georgia,'Noto Serif KR',serif" font-size="20" font-weight="600">17.</text>
<text x="180" y="387" fill="#17211F" font-family="Georgia,'Noto Serif KR',serif" font-size="20">함수 <tspan font-style="italic">f(x)</tspan>에 대하여</text>
<text x="180" y="423" fill="#17211F" font-family="Georgia,'Noto Serif KR',serif" font-size="20"><tspan font-style="italic">f′(x) = 8x³ − 1</tspan>이고 <tspan font-style="italic">f(0) = 3</tspan>일 때,</text>
<text x="180" y="459" fill="#17211F" font-family="Georgia,'Noto Serif KR',serif" font-size="20"><tspan font-style="italic">f(2)</tspan>의 값을 구하시오.</text>
<text x="441" y="459" fill="#818D86" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13">[3점]</text>
<!-- hand written example -->
<g fill="none" stroke="#42685D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".88">
 <path d="M180 585 C210 571 233 594 258 579 C279 566 299 592 324 577"/>
 <path d="M195 648 C215 638 235 657 257 642 C278 628 295 654 317 642"/>
 <path d="M205 713 C235 697 267 714 299 699 C319 690 340 705 363 696"/>
 <path d="M185 775 Q216 754 245 766 M252 766 l8 8 l17 -25"/>
</g>
<text x="185" y="555" fill="#42685D" font-family="'Comic Sans MS','Bradley Hand',cursive" font-size="18" font-style="italic" transform="rotate(-1 185 555)">f(x) = 2x⁴ − x + 3</text>
<text x="191" y="620" fill="#42685D" font-family="'Comic Sans MS','Bradley Hand',cursive" font-size="18" font-style="italic" transform="rotate(-1 191 620)">f(2) = 2 · 16 − 2 + 3</text>
<rect x="188" y="671" width="106" height="43" rx="8" fill="#E8F3EC" stroke="#BFD5C7"/>
<text x="241" y="699" text-anchor="middle" fill="#21695C" font-family="'Comic Sans MS','Bradley Hand',cursive" font-size="20" font-style="italic" font-weight="700">= 33</text>
<text x="705" y="1040" text-anchor="end" fill="#A7B1AB" font-family="Arial,'Noto Sans KR',sans-serif" font-size="10">풀이 예시</text>
