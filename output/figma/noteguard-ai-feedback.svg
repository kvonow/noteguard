<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1420" viewBox="0 0 834 1420" fill="none"><title>NoteGuard AI 오답 분석</title><desc>편집 가능한 텍스트와 도형으로 구성한 세로형 화면. 예시 데이터.</desc>
<rect x="0" y="0" width="834" height="1420" rx="0" fill="#F3F6F4"/>
<g id="Header">
<rect x="0" y="0" width="834" height="85" rx="0" fill="#FFFFFF"/>
<text x="38" y="52" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700">NoteGuard.</text>
<text x="565" y="49" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400">AI 오답 분석 · 예시 데이터</text>
</g>
<g id="Title">
<text x="40" y="132" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="700">MY LEARNING REPORT</text>
<text x="40" y="184" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="700">틀린 이유를 알면,</text>
<text x="40" y="231" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="700">다음 풀이가 달라져요.</text>
<text x="40" y="271" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="400">9월 모의평가 · 수학</text>
<text x="40" y="301" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="400">이번 시험의 오답과 풀이 과정을 분석했어요.</text>
</g>
<g id="Summary">
<rect x="40" y="331" width="754" height="110" rx="14" fill="#E7F1E9"/>
<rect x="291" y="354" width="1" height="63" rx="0" fill="#D4E2D8"/>
<rect x="543" y="354" width="1" height="63" rx="0" fill="#D4E2D8"/>
<text x="108" y="382" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="33" font-weight="700">24 / 30</text>
<text x="105" y="415" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="400">맞힌 문항</text>
<text x="397" y="382" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="33" font-weight="700">6</text>
<text x="394" y="415" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="400">오답 문항</text>
<text x="647" y="382" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="33" font-weight="700">3</text>
<text x="644" y="415" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="400">집중 복습 영역</text>
</g>
<text x="40" y="482" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700">AI가 발견한 학습 포인트</text>
<text x="544" y="480" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="400">관련 문항을 눌러 확인하세요</text>
<g id="Calculation">
<rect x="40" y="505" width="754" height="208" rx="16" fill="#FFFFFF" stroke="#E1E9E4"/>
<circle cx="71" cy="536" r="4" fill="#9D6036"/>
<text x="84" y="541" fill="#9D6036" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600">반복된 계산 실수</text>
<text x="68" y="578" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="700">미분할 때 계수와 부호를 놓쳤어요.</text>
<text x="68" y="610" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">접근 방법은 맞았지만, 계수를 곱하거나 음수를 계산하는</text>
<text x="68" y="636" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">과정에서 실수가 반복됐어요.</text>
<text x="68" y="683" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400">관련 문항</text>
<g id="Question-7번">
<rect x="151" y="659" width="76" height="34" rx="7" fill="#E7F1E9"/>
<text x="163" y="682" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600">7번 ↗</text>
</g>
<g id="Question-12번">
