</g>
<g id="Calculation-More">
<text x="602" y="683" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600">보완 방법 보기 ＋</text>
</g>
</g>
<g id="Trigonometry">
<rect x="40" y="729" width="754" height="208" rx="16" fill="#FFFFFF" stroke="#E1E9E4"/>
<circle cx="71" cy="760" r="4" fill="#9D6036"/>
<text x="84" y="765" fill="#9D6036" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600">개념 복습 필요</text>
<text x="68" y="802" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="700">삼각함수의 주기를 다시 확인해요.</text>
<text x="68" y="834" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">그래프가 변할 때 주기를 적용하는 데 어려움이 보였어요.</text>
<text x="68" y="860" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">x 앞의 계수와 주기의 관계를 복습해보세요.</text>
<text x="68" y="907" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400">관련 문항</text>
<g id="Question-9번">
<rect x="151" y="883" width="76" height="34" rx="7" fill="#E7F1E9"/>
<text x="163" y="906" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600">9번 ↗</text>
