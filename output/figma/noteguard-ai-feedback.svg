<g id="Recommended-Practice">
<text x="42" y="1220" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="400">✦</text>
<text x="83" y="1216" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700">오늘은 미분 계산부터 복습해볼까요?</text>
<text x="83" y="1247" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">같은 실수를 줄이는 유사 문제를 준비했어요.</text>
