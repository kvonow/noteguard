<g id="Question-15번">
<rect x="236" y="883" width="76" height="34" rx="7" fill="#E7F1E9"/>
<text x="248" y="906" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600">15번 ↗</text>
</g>
<g id="Trigonometry-More">
<text x="602" y="907" fill="#216C53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600">보완 방법 보기 ＋</text>
</g>
</g>
<g id="Conditions">
<rect x="40" y="953" width="754" height="208" rx="16" fill="#FFFFFF" stroke="#E1E9E4"/>
<circle cx="71" cy="984" r="4" fill="#9D6036"/>
<text x="84" y="989" fill="#9D6036" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600">조건 확인 누락</text>
<text x="68" y="1026" fill="#193C34" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="700">구한 답이 조건에 맞는지 확인해요.</text>
<text x="68" y="1058" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">계산으로 구한 값을 문제의 범위와 대조하는 과정이 빠졌어요.</text>
<text x="68" y="1084" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="400">마지막 조건 확인만으로 줄일 수 있는 오답이에요.</text>
<text x="68" y="1131" fill="#6B7C74" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400">관련 문항</text>
<g id="Question-20번">
<rect x="151" y="1107" width="76" height="34" rx="7" fill="#E7F1E9"/>
