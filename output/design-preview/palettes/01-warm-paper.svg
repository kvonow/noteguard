<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#38291E" flood-opacity=".12"/></filter><filter id="t"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38291E" flood-opacity=".1"/></filter></defs><rect width="834" height="1194" rx="28" fill="#EAE4DA"/><rect width="834" height="88" rx="28" fill="#FBF8F1"/><rect y="62" width="834" height="26" fill="#FBF8F1"/><rect x="42" y="26" width="36" height="36" rx="12" fill="#455C4D"/><text x="60" y="50" text-anchor="middle" fill="#FBF8F1" font-family="Arial" font-weight="700" font-size="16">N</text><text x="90" y="51" fill="#252A25" font-family="Arial,sans-serif" font-weight="700" font-size="22">NoteGuard</text><text x="700" y="50" fill="#79796F" font-family="Arial,'Noto Sans KR',sans-serif" font-size="12">학습 공간</text><circle cx="772" cy="44" r="16" fill="#E9E5DB"/><text x="772" y="48" text-anchor="middle" fill="#455C4D" font-family="Arial,'Noto Sans KR',sans-serif" font-size="11" font-weight="700">해</text><path d="M0 87.5H834" stroke="#E8E1D6"/><text x="44" y="127" fill="#88877D" font-family="Arial,'Noto Sans KR',sans-serif" font-size="12">오답노트</text><text x="111" y="127" fill="#B9B2A6" font-family="Arial,sans-serif" font-size="14">›</text><text x="129" y="127" fill="#455C4D" font-family="Arial,'Noto Sans KR',sans-serif" font-size="12" font-weight="700">유사 문제 풀이</text><text x="44" y="163" fill="#798572" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">RETRY  /  PRACTICE</text><text x="44" y="202" fill="#252A25" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="700">한 문제 더 풀어볼까요?</text><text x="44" y="230" fill="#85847A" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13">문제 위에 풀이를 적고, 다 풀면 채점해 보세요.</text><rect x="626" y="174" width="164" height="42" rx="12" fill="#FBF8F1" stroke="#E1DBD0"/><text x="642" y="201" fill="#455C4D" font-family="Arial" font-weight="700" font-size="16">01</text><text x="670" y="201" fill="#B6B1A7" font-family="Arial" font-size="13">/ 02</text><rect x="716" y="184" width="62" height="22" rx="7" fill="#EFE7D8"/><text x="747" y="199" text-anchor="middle" fill="#8A6F49" font-family="Arial,'Noto Sans KR',sans-serif" font-size="10" font-weight="700">유사 문제</text><rect x="44" y="250" width="746" height="4" rx="2" fill="#DDD8CE"/><rect x="44" y="250" width="343" height="4" rx="2" fill="#455C4D"/><rect x="91" y="278" width="652" height="795" rx="8" fill="#FFFDF8" stroke="#E3DDD2" filter="url(#s)"/><text x="129" y="319" fill="#99958B" font-family="Arial,'Noto Sans KR',sans-serif" font-size="10" font-weight="600" letter-spacing="1">유사 문제</text><text x="705" y="319" text-anchor="end" fill="#99958B" font-family="Arial,sans-serif" font-size="10">17번</text><path d="M129 335H705" stroke="#EEE9DF"/><text x="129" y="387" fill="#292E29" font-family="Georgia,'Noto Serif KR',serif" font-size="20" font-weight="600">17.</text><text x="180" y="387" fill="#292E29" font-family="Georgia,'Noto Serif KR',serif" font-size="20">함수 <tspan font-style="italic">f(x)</tspan>에 대하여</text><text x="180" y="423" fill="#292E29" font-family="Georgia,'Noto Serif KR',serif" font-size="20"><tspan font-style="italic">f′(x) = 8x³ − 1</tspan>이고 <tspan font-style="italic">f(0) = 3</tspan>일 때,</text><text x="180" y="459" fill="#292E29" font-family="Georgia,'Noto Serif KR',serif" font-size="20"><tspan font-style="italic">f(2)</tspan>의 값을 구하시오.</text><text x="441" y="459" fill="#89867C" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13">[3점]</text><text x="185" y="555" fill="#4F6655" font-family="'Comic Sans MS',cursive" font-size="18" font-style="italic">f(x) = 2x⁴ − x + 3</text><text x="191" y="620" fill="#4F6655" font-family="'Comic Sans MS',cursive" font-size="18" font-style="italic">f(2) = 32 − 2 + 3</text><rect x="188" y="671" width="106" height="43" rx="8" fill="#EDF0E6" stroke="#CFD6C9"/><text x="241" y="699" text-anchor="middle" fill="#455C4D" font-family="'Comic Sans MS',cursive" font-size="20" font-style="italic" font-weight="700">= 33</text><text x="705" y="1040" text-anchor="end" fill="#A39E93" font-family="Arial,'Noto Sans KR',sans-serif" font-size="10">풀이 예시</text><g filter="url(#t)"><rect x="255" y="1000" width="324" height="62" rx="17" fill="#FFFEFA" stroke="#E4DED3"/></g><rect x="266" y="1009" width="90" height="44" rx="11" fill="#455C4D"/><text x="284" y="1037" fill="#fff" font-family="Arial" font-size="19">✎</text><text x="316" y="1036" fill="#fff" font-family="Arial,'Noto Sans KR',sans-serif" font-size="11" font-weight="600">펜</text><rect x="362" y="1009" width="90" height="44" rx="11" fill="#F5F2EA"/><text x="380" y="1037" fill="#6D736B" font-family="Arial" font-size="17">⌫</text><text x="408" y="1036" fill="#6D736B" font-family="Arial,'Noto Sans KR',sans-serif" font-size="11">지우개</text><path d="M462 1019V1043" stroke="#E7E1D6"/><text x="478" y="1038" fill="#6D736B" font-family="Arial" font-size="19">↶</text><text x="503" y="1036" fill="#6D736B" font-family="Arial,'Noto Sans KR',sans-serif" font-size="11">실행 취소</text><rect y="1110" width="834" height="84" fill="#FBF8F1"/><path d="M0 1110H834" stroke="#E2DCD1"/><text x="44" y="1160" fill="#72786E" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13">← 오답 문제로</text><rect x="568" y="1129" width="112" height="46" rx="12" fill="#FBF8F1" stroke="#E0DACE"/><text x="624" y="1158" text-anchor="middle" fill="#68736A" font-family="Arial,'Noto Sans KR',sans-serif" font-size="12" font-weight="600">다른 유사 문제</text><rect x="692" y="1129" width="98" height="46" rx="12" fill="#455C4D" filter="url(#t)"/><text x="738" y="1158" text-anchor="middle" fill="#FFFDF8" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" font-weight="700">채점하기</text><text x="773" y="1158" fill="#E3D68D" font-family="Arial" font-size="17" font-weight="700">→</text></svg>
